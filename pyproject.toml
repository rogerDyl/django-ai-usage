[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ai-usage"
version = "0.1.0"
description = "Calls AI models through the OpenAI Agents SDK and LiteLLM, and stores their usage in the database."
requires-python = ">=3.12"
dependencies = ["django>=5.0", "openai-agents[litellm]>=0.24"]

[tool.setuptools.packages.find]
include = ["ai_usage*"]
