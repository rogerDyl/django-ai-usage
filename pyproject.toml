[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ai-usage"
version = "0.1.0"
description = "Appelle les modèles d'IA via le SDK OpenAI Agents et LiteLLM, et enregistre leur utilisation en base."
requires-python = ">=3.12"
dependencies = ["django>=5.0", "openai-agents[litellm]>=0.24"]

[tool.setuptools.packages.find]
include = ["ai_usage*"]
